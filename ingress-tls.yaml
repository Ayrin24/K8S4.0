apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-tls
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - 62-84-118-36.sslip.io
    secretName: tls-secret
  rules:
  - host: 62-84-118-36.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 80
